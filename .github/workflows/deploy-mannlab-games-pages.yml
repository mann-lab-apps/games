name: Deploy Mannlab Games to Pages

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-mannlab-games-pages.yml"
      - "web/mannlab-games/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mannlab-games-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/mannlab-games
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/mannlab-games/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
        run: npm run build

      - name: Add SPA fallback
        run: |
          mkdir -p dist/10000
          mkdir -p dist/drum-duel
          mkdir -p dist/dopamine-swap
          mkdir -p dist/privacy
          cp dist/index.html dist/10000/index.html
          cp dist/index.html dist/drum-duel/index.html
          cp dist/index.html dist/dopamine-swap/index.html
          cp dist/index.html dist/privacy/index.html
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/mannlab-games/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
